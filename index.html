<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小包的个人名片 | XBAOS</title>
    <!-- 引入 Font Awesome 图标库用于社交图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 基础样式重置与全局设置 */
        :root {
            --primary-color: #5B8DEF; /* 主色调：柔和蓝色 */
            --primary-hover: #4A90D9;
            --text-dark: #333333;    /* 深灰色文字 */
            --text-light: #666666;   /* 稍浅的灰色文字 */
            --bg-color: #F8F9FA;     /* 极浅灰色背景 */
            --white: #FFFFFF;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            --transition: all 0.3 ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        a {
            text-decoration: none;
            color: var(--primary-color);
            transition: var(--transition);
        }

        a:hover {
            color: var(--primary-hover);
        }

        /* 导航栏 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow);
            z-index: 1000;
            display: flex;
            justify-content: center;
            padding: 15px 0;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: var(--text-dark);
            font-weight: 500;
            font-size: 16px;
            position: relative;
            padding: 5px 0;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--primary-color);
            transition: var(--transition);
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* 主体内容容器 */
        .container {
            max-width: 800px;
            margin: 120px auto 60px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 个人头像 */
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--white);
            box-shadow: 0 8px 16px rgba(91, 141, 239, 0.2);
            margin-bottom: 20px;
            transition: var(--transition);
        }

        .avatar:hover {
            transform: scale(1.05);
        }

        /* 昵称 */
        .nickname {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        /* 一句话简介 */
        .tagline {
            font-size: 1.2rem;
            color: var(--text-light);
            margin-bottom: 40px;
            text-align: center;
        }

        /* 卡片通用样式 (用于关于我) */
        .card {
            background: var(--white);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            box-shadow: var(--shadow);
            margin-bottom: 40px;
            transition: var(--transition);
        }

        .card:hover {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px);
        }

        /* 关于我区块标题 */
        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -5px;
            width: 40px;
            height: 3px;
            background-color: var(--primary-color);
            border-radius: 2px;
        }

        /* 关于我文字 */
        .about-text {
            color: var(--text-light);
            font-size: 1.05rem;
            text-align: justify;
        }

        /* 社交图标 */
        .social-icons {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            justify-content: center;
        }

        .social-icons a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            background-color: var(--bg-color);
            color: var(--text-light);
            border-radius: 50%;
            font-size: 1.3rem;
            transition: var(--transition);
        }

        .social-icons a:hover {
            background-color: var(--primary-color);
            color: var(--white);
            transform: translateY(-3px);
        }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 30px 0;
            color: var(--text-light);
            font-size: 0.9rem;
            border-top: 1px solid #EAEAEA;
            width: 100%;
            margin-top: auto;
        }

        /* 响应式设计 */
        @media (max-width: 600px) {
            .nav-links {
                gap: 20px;
            }
            
            .nav-links a {
                font-size: 15px;
            }

            .container {
                margin-top: 100px;
            }

            .avatar {
                width: 120px;
                height: 120px;
            }

            .nickname {
                font-size: 2rem;
            }

            .tagline {
                font-size: 1rem;
                margin-bottom: 30px;
            }

            .card {
                padding: 25px;
            }

            .social-icons a {
                width: 45px;
                height: 45px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-links">
            <a href="#home">首页</a>
            <a href="#about">关于我</a>
            <a href="#contact">联系我</a>
        </div>
    </nav>

    <!-- 主体内容 -->
    <main class="container" id="home">
        
        <!-- 头像 -->
        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Xiaobao&backgroundColor=5B8DEF" alt="小包的头像" class="avatar">
        
        <!-- 昵称 -->
        <h1 class="nickname">小包</h1>
        
        <!-- 一句话简介 -->
        <p class="tagline">嗨嗨，这里是有趣的XBAOS频道！一起玩耍吧~</p>

        <!-- 关于我模块 -->
        <section class="card" id="about">
            <h2 class="section-title">关于我</h2>
            <p class="about-text">
                你好！我是小包。我是一个对世界充满好奇心、热爱探索和分享的人。我相信每一份微小的努力都能带来改变，也喜欢用文字和代码记录生活中的点滴灵感。在这里，你可以看到我的所思所想和一些小小的作品。我始终保持积极向上的心态，乐于接受新事物，希望能在这里遇到志同道合的朋友，一起交流，一起成长！
            </p>
        </section>

        <!-- 社交图标 / 联系我 -->
        <section class="social-icons" id="contact">
            <!-- 链接暂填 # -->
            <a href="#" title="GitHub" aria-label="GitHub"><i class="fab fa-github"></i></a>
            <a href="#" title="微博" aria-label="微博"><i class="fab fa-weibo"></i></a>
            <a href="#" title="微信" aria-label="微信"><i class="fab fa-weixin"></i></a>
            <a href="#" title="邮箱" aria-label="邮箱"><i class="fas fa-envelope"></i></a>
        </section>

    </main>

    <!-- 页脚 -->
    <footer>
        <p>&copy; 2026 XBAOS. All Rights Reserved.</p>
    </footer>

    <!-- 平滑滚动 JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 监听所有导航栏链接和联系链接的点击事件
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    
                    const targetId = this.getAttribute('href');
                    const targetElement = document.querySelector(targetId);
                    
                    if (targetElement) {
                        // 获取导航栏的高度，用于偏移量计算，防止内容被导航栏遮挡
                        const navHeight = document.querySelector('.navbar').offsetHeight;
                        const elementPosition = targetElement.getBoundingClientRect().top;
                        const offsetPosition = elementPosition + window.pageYOffset - navHeight - 20; // 多减20px留点空隙

                        window.scrollTo({
                            top: offsetPosition,
                            behavior: 'smooth'
                        });
                    }
                });
            });
        });
    </script>
</body>
</html>
