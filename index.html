<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ZERO RT</title>
<meta name="description" content="ZERO RT · 一方小天地。">
<meta name="theme-color" content="#0a0806">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="css/wenkai.css">
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<div class="atmosphere"></div>

<!-- ══════════════════════════════════════════════
     第一幕 · 信
     ══════════════════════════════════════════════ -->
<section class="act is-active" id="act-letter">

  <div class="overture" id="overture">
    <p class="overture-to" id="overtureTo"></p>
    <button class="overture-hint" id="overtureHint" data-text="letter.hint"></button>
  </div>

  <div class="letter-scroll" id="letterScroll">
    <div class="letter-inner" id="letterInner">
      <div class="letter-heading" id="letterHeading"></div>
      <div id="letterBody"></div>
      <div class="letter-closing" id="letterClosing"></div>
      <div class="letter-sign" id="letterSign"></div>
    </div>
  </div>

  <div class="letter-wait" id="letterWait" data-text="letter.wait"></div>

  <div class="letter-bar" id="letterBar">
    <button class="audio-btn" id="audioBtn">
      <span class="ring"><i class="audio-icon"></i></span>
      <span id="audioLabel"></span>
    </button>
    <button class="skip-btn" id="skipBtn" data-text="letter.skip"></button>
    <button class="btn-ghost btn-next" id="toIntro" data-text="letter.next" hidden></button>
  </div>
</section>

<!-- ══════════════════════════════════════════════
     第二幕 · 介绍
     ══════════════════════════════════════════════ -->
<section class="act" id="act-intro">
  <div class="intro-box">
    <p class="intro-kicker" id="introKicker"></p>
    <h1 class="intro-title" id="introTitle"></h1>
    <div class="intro-lines" id="introLines"></div>
    <div class="intro-foot">
      <button class="btn-ghost" id="toHole"></button>
    </div>
  </div>
</section>

<!-- ══════════════════════════════════════════════
     第三幕 · 树洞
     ══════════════════════════════════════════════ -->
<section class="act" id="act-hole">

  <header class="hole-head">
    <div class="hole-head-in">
      <div class="brand" id="brand"></div>
      <nav class="tabs">
        <button class="tab is-on" data-pane="memories" id="tabMemories"></button>
        <button class="tab" data-pane="messages" id="tabMessages"></button>
        <button class="tab" data-pane="todos" id="tabTodos"></button>
      </nav>
    </div>
    <div class="today-line" id="todayLine"></div>
  </header>

  <main class="hole-main">
    <div class="pane is-on" id="pane-memories">
      <div class="pane-bar">
        <div class="pane-hint">
          <button class="shuffle" id="shuffleBtn" type="button"></button>
          <span id="hintMemories"></span>
        </div>
        <div class="view-switch" id="viewSwitch">
          <button data-view="grid" class="is-on"></button>
          <button data-view="timeline"></button>
          <button data-view="map"></button>
        </div>
      </div>
      <div class="mem-grid" id="memGrid"></div>
      <div class="mem-timeline" id="memTimeline" hidden></div>
      <div class="mem-map" id="memMap" hidden>
        <div class="map-hint" id="mapHint" hidden></div>
        <div class="map-board" id="mapBoard">
          <svg class="map-svg" id="mapSvg" viewBox="0 0 1000 841" preserveAspectRatio="xMidYMid meet" aria-label="去过的城市"></svg>
        </div>
        <div class="map-foot" id="mapFoot"></div>
      </div>
      <div class="empty" id="memEmpty" hidden></div>
    </div>

    <div class="pane" id="pane-messages">
      <div class="pane-hint"><span id="hintMessages"></span></div>
      <div class="msg-list" id="msgList"></div>
      <div class="empty" id="msgEmpty" hidden></div>
    </div>

    <div class="pane" id="pane-todos">
      <div class="pane-hint"><span id="hintTodos"></span></div>
      <div class="todo-list" id="todoList"></div>
      <div class="empty" id="todoEmpty" hidden></div>

      <!-- 已经做完的：平时只是一行字，点开才铺成一列 -->
      <div class="todo-done" id="todoDone" hidden>
        <button class="todo-done-toggle" id="todoDoneToggle" type="button">
          <span id="todoDoneLabel"></span>
          <i class="todo-done-caret"></i>
        </button>
        <div class="todo-list is-archive" id="todoDoneList" hidden></div>
      </div>
    </div>

    <footer class="hole-foot">
      <button class="log-open" id="logOpen" type="button">
        <span class="log-open-label" id="logOpenLabel">更新日志</span>
        <span class="log-open-text" id="logOpenText"></span>
      </button>
    </footer>
  </main>

  <div class="fab-menu" id="fabMenu">
    <button data-add="memory">加一段回忆</button>
    <button data-add="message">写点什么</button>
    <button data-add="todo">加一件事</button>
  </div>
  <button class="fab" id="fab" aria-label="添加">+</button>
</section>

<!-- ══════════════════════════════════════════════
     弹窗：口令
     ══════════════════════════════════════════════ -->
<div class="modal-mask" id="keyMask">
  <div class="modal is-narrow">
    <h2 class="modal-title" id="keyTitle"></h2>
    <p class="modal-sub" id="keySub"></p>
    <div class="field">
      <input type="password" id="keyInput" autocomplete="off" data-ph="key.ph">
    </div>
    <p class="form-err" id="keyErr"></p>
    <div class="modal-actions">
      <button class="btn-plain" data-close="keyMask" data-text="key.cancel"></button>
      <button class="btn-solid" id="keyOk" data-text="key.ok"></button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════
     弹窗：加回忆
     ══════════════════════════════════════════════ -->
<div class="modal-mask" id="memMask">
  <div class="modal">
    <h2 class="modal-title" data-text="memory.title"></h2>
    <p class="modal-sub" data-text="memory.sub"></p>

    <div class="field">
      <label data-text="memory.photo"></label>
      <div class="drop" id="drop">
        <span data-html="memory.drop"></span>
        <img id="dropPreview" alt="" hidden>
        <button class="crop-pick" id="cropPickBtn" type="button" data-text="memory.cropBtn" hidden></button>
        <input type="file" id="fileInput" accept="image/*">
      </div>
    </div>

    <div class="field">
      <label data-text="memory.titleLabel"></label>
      <input type="text" id="memTitle" maxlength="40" data-ph="memory.titlePh">
    </div>

    <div class="field">
      <label data-text="memory.noteLabel"></label>
      <textarea id="memNote" rows="3" maxlength="500" data-ph="memory.notePh"></textarea>
    </div>

    <div class="field">
      <label data-text="memory.dateLabel"></label>
      <input type="date" id="memDate">
    </div>

    <div class="field">
      <label data-text="memory.who"></label>
      <div class="chip-row" id="memAuthorChips"></div>
    </div>

    <p class="form-err" id="memErr"></p>
    <div class="modal-actions">
      <button class="btn-plain" data-close="memMask" data-text="memory.cancel"></button>
      <button class="btn-solid" id="memOk" data-text="memory.ok"></button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════
     弹窗：卡片取景（缩略图显示哪一块）
     ══════════════════════════════════════════════ -->
<div class="modal-mask" id="cropMask">
  <div class="modal is-crop">
    <h2 class="modal-title" data-text="crop.title"></h2>
    <p class="modal-sub" data-text="crop.sub"></p>
    <div class="cropper" id="cropper">
      <img id="cropImg" alt="">
      <div class="crop-frame" id="cropFrame"><i class="crop-grip"></i></div>
    </div>
    <p class="form-err" id="cropErr"></p>
    <div class="modal-actions">
      <button class="btn-plain" data-close="cropMask" data-text="crop.cancel"></button>
      <button class="btn-solid" id="cropOk" data-text="crop.ok"></button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════
     弹窗：留言
     ══════════════════════════════════════════════ -->
<div class="modal-mask" id="msgMask">
  <div class="modal">
    <h2 class="modal-title" data-text="message.title"></h2>
    <p class="modal-sub" data-text="message.sub"></p>

    <div class="field">
      <label data-text="message.who"></label>
      <div class="chip-row" id="msgAuthorChips"></div>
    </div>

    <div class="field">
      <label data-text="message.content"></label>
      <textarea id="msgContent" rows="5" maxlength="1000" data-ph="message.contentPh"></textarea>
    </div>

    <div class="field">
      <label><span data-text="message.photo"></span> <em class="lbl-note" data-text="message.photoNote"></em></label>
      <div class="mini-picker" id="msgPicker"></div>
      <input type="file" id="msgFile" accept="image/*" hidden>
    </div>

    <p class="form-err" id="msgErr"></p>
    <div class="modal-actions">
      <button class="btn-plain" data-close="msgMask" data-text="message.cancel"></button>
      <button class="btn-solid" id="msgOk" data-text="message.ok"></button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════
     弹窗：加一件事
     ══════════════════════════════════════════════ -->
<div class="modal-mask" id="todoMask">
  <div class="modal is-narrow">
    <h2 class="modal-title" data-text="todo.title"></h2>
    <p class="modal-sub" data-text="todo.sub"></p>

    <div class="field">
      <label data-text="todo.item"></label>
      <input type="text" id="todoText" maxlength="80" data-ph="todo.itemPh">
    </div>

    <div class="field">
      <label data-text="todo.who"></label>
      <div class="chip-row" id="todoAuthorChips"></div>
    </div>

    <p class="form-err" id="todoErr"></p>
    <div class="modal-actions">
      <button class="btn-plain" data-close="todoMask" data-text="todo.cancel"></button>
      <button class="btn-solid" id="todoOk" data-text="todo.ok"></button>
    </div>
  </div>
</div>

<!-- 看大图 -->
<div class="lightbox" id="lightbox">
  <div class="lb-box">
    <img id="lightboxImg" alt="">
    <div class="lb-cap" id="lightboxCap"></div>
    <div class="lb-cmt" id="lightboxCmt"></div>
  </div>
</div>

<!-- 给一个地方加照片（入口同上，连点顶部日期五次） -->
<input type="file" id="placeFile" accept="image/*" hidden>

<!-- 点开一个地方 -->
<div class="place-sheet" id="placeSheet">
  <div class="place-box">
    <div class="place-head">
      <h2 class="place-name" id="placeName"></h2>
      <span class="place-sub" id="placeSub"></span>
      <button class="place-add" id="placeAdd" type="button" data-text="place.add" hidden></button>
    </div>
    <div class="place-grid" id="placeGrid"></div>
    <button class="place-close" id="placeClose" type="button" data-text="place.close"></button>
  </div>
</div>

<!-- 更新日志：只读，从新到旧 -->
<div class="log-sheet" id="logSheet">
  <div class="log-box">
    <div class="log-head">
      <h2 class="log-title" id="logTitle"></h2>
    </div>
    <div class="log-list" id="logList"></div>
    <button class="log-close" id="logClose" type="button" data-text="log.close"></button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/letter.js"></script>
<script src="js/hole.js"></script>
<script src="js/app.js"></script>
</body>
</html>
