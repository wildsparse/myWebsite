<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ZERO RT</title>
<meta name="description" content="ZERO RT · 一方小天地。">
<meta name="theme-color" content="#0a0806">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="css/wenkai.css">
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<div class="atmosphere"></div>

<!-- ══════════════════════════════════════════════
     第一幕 · 信
     ══════════════════════════════════════════════ -->
<section class="act is-active" id="act-letter">

  <div class="overture" id="overture">
    <p class="overture-to" id="overtureTo"></p>
    <button class="overture-hint" id="overtureHint">轻 触 开 始</button>
  </div>

  <div class="letter-scroll" id="letterScroll">
    <div class="letter-inner" id="letterInner">
      <div class="letter-heading" id="letterHeading"></div>
      <div id="letterBody"></div>
      <div class="letter-closing" id="letterClosing"></div>
      <div class="letter-sign" id="letterSign"></div>
    </div>
  </div>

  <div class="letter-wait" id="letterWait">声 音 正 在 赶 来 的 路 上</div>

  <div class="letter-bar" id="letterBar">
    <button class="audio-btn" id="audioBtn">
      <span class="ring"><i class="audio-icon"></i></span>
      <span id="audioLabel">一封信的声音</span>
    </button>
    <button class="skip-btn" id="skipBtn">显示全文</button>
    <button class="btn-ghost btn-next" id="toIntro" hidden>下 一 步</button>
  </div>
</section>

<!-- ══════════════════════════════════════════════
     第二幕 · 介绍
     ══════════════════════════════════════════════ -->
<section class="act" id="act-intro">
  <div class="intro-box">
    <p class="intro-kicker" id="introKicker"></p>
    <h1 class="intro-title" id="introTitle"></h1>
    <div class="intro-lines" id="introLines"></div>
    <div class="intro-foot">
      <button class="btn-ghost" id="toHole"></button>
    </div>
  </div>
</section>

<!-- ══════════════════════════════════════════════
     第三幕 · 树洞
     ══════════════════════════════════════════════ -->
<section class="act" id="act-hole">

  <header class="hole-head">
    <div class="hole-head-in">
      <div class="brand" id="brand"></div>
      <nav class="tabs">
        <button class="tab is-on" data-pane="memories" id="tabMemories"></button>
        <button class="tab" data-pane="messages" id="tabMessages"></button>
        <button class="tab" data-pane="todos" id="tabTodos"></button>
      </nav>
    </div>
    <div class="today-line" id="todayLine"></div>
  </header>

  <main class="hole-main">
    <div class="pane is-on" id="pane-memories">
      <div class="pane-bar">
        <div class="pane-hint"><span id="hintMemories"></span></div>
        <div class="view-switch" id="viewSwitch">
          <button data-view="grid" class="is-on"></button>
          <button data-view="timeline"></button>
        </div>
      </div>
      <div class="mem-grid" id="memGrid"></div>
      <div class="mem-timeline" id="memTimeline" hidden></div>
      <div class="empty" id="memEmpty" hidden></div>
    </div>

    <div class="pane" id="pane-messages">
      <div class="pane-hint"><span id="hintMessages"></span></div>
      <div class="msg-list" id="msgList"></div>
      <div class="empty" id="msgEmpty" hidden></div>
    </div>

    <div class="pane" id="pane-todos">
      <div class="pane-bar">
        <div class="pane-hint"><span id="hintTodos"></span></div>
        <button class="clear-done" id="clearDone" hidden></button>
      </div>
      <div class="todo-list" id="todoList"></div>
      <div class="empty" id="todoEmpty" hidden></div>
    </div>
  </main>

  <div class="fab-menu" id="fabMenu">
    <button data-add="memory">加一段回忆</button>
    <button data-add="message">写点什么</button>
    <button data-add="todo">加一件事</button>
  </div>
  <button class="fab" id="fab" aria-label="添加">+</button>
</section>

<!-- ══════════════════════════════════════════════
     弹窗：口令
     ══════════════════════════════════════════════ -->
<div class="modal-mask" id="keyMask">
  <div class="modal is-narrow">
    <h2 class="modal-title" id="keyTitle"></h2>
    <p class="modal-sub" id="keySub"></p>
    <div class="field">
      <input type="password" id="keyInput" autocomplete="off" placeholder="……">
    </div>
    <p class="form-err" id="keyErr"></p>
    <div class="modal-actions">
      <button class="btn-plain" data-close="keyMask">算了</button>
      <button class="btn-solid" id="keyOk">进去</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════
     弹窗：加回忆
     ══════════════════════════════════════════════ -->
<div class="modal-mask" id="memMask">
  <div class="modal">
    <h2 class="modal-title">加一段回忆</h2>
    <p class="modal-sub">照片会被自动压缩，长边 1600px，肉眼看不出来。</p>

    <div class="field">
      <label>照片</label>
      <div class="drop" id="drop">
        <span>点击选一张<br>或者拖进来</span>
        <img id="dropPreview" alt="" hidden>
        <input type="file" id="fileInput" accept="image/*">
      </div>
    </div>

    <div class="field">
      <label>标题</label>
      <input type="text" id="memTitle" maxlength="40" placeholder="给这张照片起个名字">
    </div>

    <div class="field">
      <label>说明</label>
      <textarea id="memNote" rows="3" maxlength="500" placeholder="那天发生了什么"></textarea>
    </div>

    <div class="field">
      <label>时间</label>
      <input type="date" id="memDate">
    </div>

    <div class="field">
      <label>谁</label>
      <div class="chip-row" id="memAuthorChips"></div>
    </div>

    <p class="form-err" id="memErr"></p>
    <div class="modal-actions">
      <button class="btn-plain" data-close="memMask">先不放</button>
      <button class="btn-solid" id="memOk">放进去</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════
     弹窗：留言
     ══════════════════════════════════════════════ -->
<div class="modal-mask" id="msgMask">
  <div class="modal">
    <h2 class="modal-title">写点什么</h2>
    <p class="modal-sub">不用讲道理，想到什么说什么。</p>

    <div class="field">
      <label>谁在说</label>
      <div class="chip-row" id="msgAuthorChips"></div>
    </div>

    <div class="field">
      <label>内容</label>
      <textarea id="msgContent" rows="5" maxlength="1000" placeholder="……"></textarea>
    </div>

    <div class="field">
      <label>照片 <em class="lbl-note">可以不选，最多两张</em></label>
      <div class="mini-picker" id="msgPicker"></div>
      <input type="file" id="msgFile" accept="image/*" hidden>
    </div>

    <p class="form-err" id="msgErr"></p>
    <div class="modal-actions">
      <button class="btn-plain" data-close="msgMask">算了</button>
      <button class="btn-solid" id="msgOk">说完了</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════
     弹窗：加一件事
     ══════════════════════════════════════════════ -->
<div class="modal-mask" id="todoMask">
  <div class="modal is-narrow">
    <h2 class="modal-title">想一起做什么</h2>
    <p class="modal-sub">不用想得很远，想到什么写什么。</p>

    <div class="field">
      <label>这件事</label>
      <input type="text" id="todoText" maxlength="80" placeholder="比如：去看一次海">
    </div>

    <div class="field">
      <label>谁想到的</label>
      <div class="chip-row" id="todoAuthorChips"></div>
    </div>

    <p class="form-err" id="todoErr"></p>
    <div class="modal-actions">
      <button class="btn-plain" data-close="todoMask">算了</button>
      <button class="btn-solid" id="todoOk">记下</button>
    </div>
  </div>
</div>

<!-- 看大图 -->
<div class="lightbox" id="lightbox">
  <div class="lb-box">
    <img id="lightboxImg" alt="">
    <div class="lb-cap" id="lightboxCap"></div>
    <div class="lb-cmt" id="lightboxCmt"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/letter.js"></script>
<script src="js/hole.js"></script>
<script src="js/app.js"></script>
</body>
</html>
